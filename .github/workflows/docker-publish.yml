name: Publish Docker image

# Publishes goniszewski/grimoire to Docker Hub when a release tag is pushed.
# Rolling `latest` is only moved by a manual run with `promote_latest: true`,
# after the v0.5 migration and persistence checks in docs/docker-deployment.md
# have passed. See issue #217.

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
  workflow_dispatch:
    inputs:
      ref:
        description: "Release tag to build (for example v1.3.1)"
        required: true
      promote_latest:
        description: "Also move the rolling `latest` tag (only after smoke tests pass)"
        type: boolean
        default: false

permissions:
  contents: read

env:
  IMAGE: goniszewski/grimoire

jobs:
  publish:
    name: Build and push multi-arch image
    runs-on: ubuntu-latest
    steps:
      - name: Check out release tag
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.ref || github.ref }}

      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to Docker Hub
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Compute tags and labels
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ${{ env.IMAGE }}
          # Never let the action invent `latest`; it is promoted explicitly.
          flavor: latest=false
          tags: |
            type=semver,pattern={{version}},value=${{ github.event_name == 'workflow_dispatch' && inputs.ref || github.ref_name }}
            type=semver,pattern={{major}}.{{minor}},value=${{ github.event_name == 'workflow_dispatch' && inputs.ref || github.ref_name }}
            type=raw,value=latest,enable=${{ github.event_name == 'workflow_dispatch' && inputs.promote_latest }}

      - name: Build and push
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: true
          sbom: true
