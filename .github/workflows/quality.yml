name: Quality Gates

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same PR supersedes the older run. Pushes to main are
# never cancelled.
concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  quality:
    name: Lint, types, unit tests, docs, build
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2

      - name: Verify frontend Bun lockfile
        run: bun install --frozen-lockfile --lockfile-only --ignore-scripts

      - name: Install frontend dependencies
        run: npm ci --ignore-scripts

      - name: Install daemon dependencies
        working-directory: daemon
        run: bun install --frozen-lockfile

      - name: Run canonical quality gate
        run: npm run check

  demo:
    name: Build and smoke-test static demo
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install frontend dependencies
        run: npm ci --ignore-scripts

      - name: Build demo profile
        run: npm run build:demo

      - name: Guard demo bundle from daemon URLs
        run: npm run verify:demo-bundle

      - name: Install Chromium for demo smoke test
        run: ./node_modules/.bin/playwright install --with-deps chromium

      - name: Run demo browser smoke test
        run: npm run test:e2e:demo

      - name: Upload demo bundle
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: grimoire-demo-dist
          path: dist/
          if-no-files-found: error

  # macOS minutes bill at about 10x Linux, so the Homebrew smoke test runs only
  # when it can fail: on pushes to main, on manual runs, and on pull requests
  # that touch packaging inputs. The cheap Linux job below decides which.
  changes:
    name: Detect packaging changes
    runs-on: ubuntu-latest
    outputs:
      packaging: ${{ steps.diff.outputs.packaging }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Compare against the base branch
        id: diff
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ "$GITHUB_EVENT_NAME" != "pull_request" ]; then
            echo "packaging=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if git diff --name-only "$BASE_SHA"...HEAD | grep -Eq '^(Formula/|install\.sh$|package(-lock)?\.json$|bun\.lock|daemon/package\.json$|scripts/(homebrew-|package-release|release-|installed-app-smoke)|\.github/workflows/quality\.yml$)'; then
            echo "packaging=true" >> "$GITHUB_OUTPUT"
          else
            echo "packaging=false" >> "$GITHUB_OUTPUT"
          fi

  homebrew:
    name: Homebrew tap and install smoke test
    needs: changes
    if: needs.changes.outputs.packaging == 'true'
    runs-on: macos-latest
    timeout-minutes: 20
    env:
      HOMEBREW_NO_AUTO_UPDATE: "1"
      HOMEBREW_NO_ENV_HINTS: "1"
      HOMEBREW_NO_INSTALL_CLEANUP: "1"
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2

      - name: Build candidate archive
        run: |
          npm ci --ignore-scripts
          npm run package:release
          npm run release:formula:prepare -- release/release-manifest.json
          echo "HOMEBREW_TEST_EXPECTED_VERSION=$(node -p 'require("./package.json").version')" >> "$GITHUB_ENV"

      - name: Validate local tap and install formula
        env:
          HOMEBREW_TEST_ARCHIVE_DIR: ${{ github.workspace }}/release
        run: bash scripts/homebrew-smoke.sh
