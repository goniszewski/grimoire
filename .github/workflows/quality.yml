name: Quality Gates

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  quality:
    name: Lint, types, unit tests, docs, build
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2

      - name: Verify frontend Bun lockfile
        run: bun install --frozen-lockfile --lockfile-only --ignore-scripts

      - name: Install frontend dependencies
        run: npm ci --ignore-scripts

      - name: Install daemon dependencies
        working-directory: daemon
        run: bun install --frozen-lockfile

      - name: Run canonical quality gate
        run: npm run check

  demo:
    name: Build and smoke-test static demo
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install frontend dependencies
        run: npm ci --ignore-scripts

      - name: Build demo profile
        run: npm run build:demo

      - name: Guard demo bundle from daemon URLs
        run: npm run verify:demo-bundle

      - name: Install Chromium for demo smoke test
        run: ./node_modules/.bin/playwright install --with-deps chromium

      - name: Run demo browser smoke test
        run: npm run test:e2e:demo

      - name: Upload demo bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: grimoire-demo-dist
          path: dist/
          if-no-files-found: error

  homebrew:
    name: Homebrew tap and install smoke test
    runs-on: macos-latest
    env:
      HOMEBREW_NO_AUTO_UPDATE: "1"
      HOMEBREW_NO_ENV_HINTS: "1"
      HOMEBREW_NO_INSTALL_CLEANUP: "1"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2

      - name: Build candidate archive
        run: |
          npm ci --ignore-scripts
          npm run package:release -- --platform macos
          python3 - <<'PYTHON'
          import json, os, pathlib, re
          artifact = json.loads(pathlib.Path("release/release-manifest.json").read_text())["artifacts"][0]
          version = json.loads(pathlib.Path("package.json").read_text())["version"]
          formula = pathlib.Path("Formula/grimoire.rb")
          text, count = re.subn(r'(url "https://github.com/goniszewski/grimoire/releases/download/)v[^/]+/little-imp-[^"]+-macos.tar.gz', lambda match: match[1] + f'v{version}/little-imp-{version}-macos.tar.gz', formula.read_text(), count=1)
          assert count == 1
          text, count = re.subn(r'(sha256 ")[a-f0-9]{64}(")', lambda match: match[1] + artifact["sha256"] + match[2], text, count=1)
          assert count == 1
          formula.write_text(text)
          with open(os.environ["GITHUB_ENV"], "a") as env:
              env.write(f"HOMEBREW_TEST_EXPECTED_VERSION={version}\n")
          PYTHON

      - name: Validate local tap and install formula
        env:
          HOMEBREW_TEST_ARCHIVE_DIR: ${{ github.workspace }}/release
        run: bash scripts/homebrew-smoke.sh
