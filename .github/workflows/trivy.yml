name: Trivy scan

# Fork-only CI gate: this repo's purpose is to track upstream dependency bumps
# and verify them against Trivy before redeploying. Kept separate from
# quality.yml (upstream-owned) so upstream syncs never conflict here.

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  fs-scan:
    name: Trivy filesystem scan (dependencies)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Trivy fs scan
        uses: aquasecurity/trivy-action@0.29.0
        with:
          scan-type: fs
          scan-ref: .
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

  image-scan:
    name: Build image and Trivy scan
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build image
        run: docker build -t grimoire:ci .

      - name: Trivy image scan
        uses: aquasecurity/trivy-action@0.29.0
        with:
          image-ref: grimoire:ci
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
