name: Upstream sync check

# Watches goniszewski/grimoire (the upstream this repo is forked from) and opens/
# updates a PR whenever upstream/main gets commits this fork doesn't have yet.
# The PR is a signal, not an auto-merge: reconcile it manually following
# CATCHUP-v1.2.md (re-apply the local Trivy CVE patch branch on top).

on:
  schedule:
    - cron: "0 7 * * 1" # every Monday 07:00 UTC
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    if: github.repository == 'bbossa/grimoire'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Fetch upstream
        run: |
          git remote add upstream https://github.com/goniszewski/grimoire.git
          git fetch upstream main --tags

      - name: Check for new upstream commits
        id: diff
        run: |
          UPSTREAM_SHA=$(git rev-parse upstream/main)
          AHEAD=$(git rev-list --count origin/main..upstream/main)
          echo "upstream_sha=$UPSTREAM_SHA" >> "$GITHUB_OUTPUT"
          echo "ahead=$AHEAD" >> "$GITHUB_OUTPUT"
          echo "$AHEAD commit(s) on upstream/main not yet in main (upstream @ $UPSTREAM_SHA)"

      - name: Update sync branch and PR
        if: steps.diff.outputs.ahead != '0'
        env:
          GH_TOKEN: ${{ github.token }}
          AHEAD: ${{ steps.diff.outputs.ahead }}
          UPSTREAM_SHA: ${{ steps.diff.outputs.upstream_sha }}
        run: |
          git branch -f sync/upstream-main upstream/main
          git push origin sync/upstream-main --force

          BODY="upstream/main (goniszewski/grimoire) is ${AHEAD} commit(s) ahead of main, at \`${UPSTREAM_SHA}\`.

          Do not merge this PR directly: it is a notification branch, not a reconciled one. Follow \`CATCHUP-v1.2.md\` to merge upstream/main and re-apply the local Trivy CVE patch branch (Dockerfile \`apt-get upgrade\`, dependency overrides) on top, then re-scan with Trivy before redeploying."

          if gh pr list --head sync/upstream-main --state open --json number -q '.[0].number' | grep -q .; then
            echo "Open PR already exists for sync/upstream-main; branch push above updated it."
          else
            gh pr create \
              --base main \
              --head sync/upstream-main \
              --title "sync: upstream is ${AHEAD} commit(s) ahead" \
              --body "$BODY"
          fi

      - name: Nothing to sync
        if: steps.diff.outputs.ahead == '0'
        run: echo "main is up to date with upstream/main, nothing to do."
